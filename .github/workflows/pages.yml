name: Materializar recursos y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decodificar targets .mind (binarios)
        run: |
          for f in targets/*.b64; do [ -f "$f" ] && base64 -d "$f" > "${f%.b64}"; done
      - name: Publicar gh-pages
        run: |
          rm -rf .github README.md .git targets/*.b64
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Publicar sitio"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
